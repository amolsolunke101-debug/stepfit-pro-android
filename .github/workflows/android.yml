name: Build StepFit PRO APK

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Guard against Firebase Storage reintroduction
        shell: bash
        run: |
          if grep -RInE 'com\\.google\\.firebase:firebase-storage|com\\.google\\.firebase\\.storage|FirebaseStorage|StorageReference|\\.putFile\\(' app/src app/build.gradle; then
            echo "Firebase Storage usage is not allowed in the no-billing app branch."
            exit 1
          fi
          echo "No Firebase Storage SDK, imports, or upload calls found."

      - name: Run Android lint
        run: gradle lintDebug

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Compile unsigned release variant
        run: gradle assembleRelease

      - name: Upload debug and unsigned release APKs
        uses: actions/upload-artifact@v4
        with:
          name: StepFit-PRO-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
